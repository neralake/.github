name: Trivy Security Scan

on:
  workflow_call:
    inputs:
      scan-ref:
        description: 'Path within the repository to scan (default: repo root)'
        required: false
        type: string
        default: '.'
      severity:
        description: 'Comma-separated severities to report (UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)'
        required: false
        type: string
        default: 'CRITICAL,HIGH'
      exit-code:
        description: 'Exit code when findings exist: 0 = advisory only, 1 = fail the job'
        required: false
        type: number
        default: 0
      ignore-unfixed:
        description: 'Ignore vulnerabilities with no available fix'
        required: false
        type: boolean
        default: true
      package-manager:
        description: 'Install dependencies before scanning: npm, pip, none'
        required: false
        type: string
        default: 'none'
    secrets:
      node-auth-token:
        description: 'Token for authenticating with private npm registries'
        required: false

jobs:
  trivy-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache Trivy vulnerability database
        uses: actions/cache@v5
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Install dependencies (npm)
        if: inputs.package-manager == 'npm'
        run: npm ci --ignore-scripts
        env:
          CLASSIC_GITHUB_TOKEN: ${{ secrets.node-auth-token }}

      # This is just an example for Python projects.
      # Customize this step for other package managers as needed, such as pnpm.
      - name: Install dependencies (pip)
        if: inputs.package-manager == 'pip'
        run: pip install -r requirements.txt

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: ${{ inputs.scan-ref }}
          severity: ${{ inputs.severity }}
          exit-code: ${{ inputs.exit-code }}
          ignore-unfixed: ${{ inputs.ignore-unfixed }}
          format: 'table'
