name: CodeQL Security Scan
description: Scans JavaScript/TypeScript source for security vulnerabilities using CodeQL's security-extended query suite. Surfaces findings as PR annotations and a job summary. Designed for NestJS/Express/GraphQL back-end services.

inputs:
  exit-code:
    description: 'Exit code when high/critical findings exist: 0 = advisory only, 1 = fail the job'
    required: false
    default: '0'

runs:
  using: composite
  steps:
    - name: Initialize CodeQL
      uses: github/codeql-action/init@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
      with:
        languages: javascript-typescript
        queries: security-extended

    - name: Run CodeQL analysis
      uses: github/codeql-action/analyze@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
      with:
        category: /language:javascript-typescript
        output: ${{ runner.temp }}/codeql-results
        upload: false

    - name: Annotate findings and write job summary
      shell: bash
      run: |
        SARIF_FILE=$(find "${{ runner.temp }}/codeql-results" -name "*.sarif" 2>/dev/null | head -1)

        {
          echo "## CodeQL Security Scan"
          echo ""
          echo "Query suite: \`security-extended\` (JavaScript/TypeScript)"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"

        if [ ! -f "$SARIF_FILE" ]; then
          echo "No SARIF output found." >> "$GITHUB_STEP_SUMMARY"
          echo "No SARIF output found — skipping annotation."
          exit 0
        fi

        # CodeQL SARIF results may omit .level on the result, deferring to the rule's
        # defaultConfiguration.level. Build a ruleId→level map and fall back to it.
        RULE_LEVEL_MAP=$(jq '
          [.runs[].tool.driver.rules[]? |
            {key: .id, value: (.defaultConfiguration.level // "note")}] | from_entries
        ' "$SARIF_FILE")

        ERROR_COUNT=$(jq --argjson rl "$RULE_LEVEL_MAP" '
          [.runs[].results[] |
            (.level // $rl[.ruleId] // "note") |
            select(. == "error")] | length
        ' "$SARIF_FILE")

        WARNING_COUNT=$(jq --argjson rl "$RULE_LEVEL_MAP" '
          [.runs[].results[] |
            (.level // $rl[.ruleId] // "note") |
            select(. == "warning")] | length
        ' "$SARIF_FILE")

        NOTE_COUNT=$(jq --argjson rl "$RULE_LEVEL_MAP" '
          [.runs[].results[] |
            (.level // $rl[.ruleId] // "note") |
            select(. == "note")] | length
        ' "$SARIF_FILE")

        jq -r --argjson rl "$RULE_LEVEL_MAP" '.runs[].results[] |
          (.level // $rl[.ruleId] // "note") as $level |
          (.locations[0].physicalLocation.artifactLocation.uri // "unknown") as $file |
          (.locations[0].physicalLocation.region.startLine // 1) as $line |
          (.ruleId // "unknown") as $rule |
          (.message.text // "") as $msg |
          if $level == "error" then
            "::error file=\($file),line=\($line),title=CodeQL: \($rule)::\($msg)"
          elif $level == "warning" then
            "::warning file=\($file),line=\($line),title=CodeQL: \($rule)::\($msg)"
          else
            "::notice file=\($file),line=\($line),title=CodeQL: \($rule)::\($msg)"
          end' "$SARIF_FILE"

        {
          echo "| Severity | Count |"
          echo "|----------|-------|"
          echo "| High / Critical | $ERROR_COUNT |"
          echo "| Medium | $WARNING_COUNT |"
          echo "| Low / Info | $NOTE_COUNT |"
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "${{ inputs.exit-code }}" = "1" ] && [ "$ERROR_COUNT" -gt 0 ]; then
          echo "CodeQL found $ERROR_COUNT high/critical finding(s). Failing job."
          exit 1
        fi
