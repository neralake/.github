name: CodeQL Security Scan
description: Scans JavaScript/TypeScript source for security vulnerabilities using CodeQL's security-extended query suite. Surfaces findings as PR annotations and a job summary. Designed for NestJS/Express/GraphQL back-end services.

inputs:
  exit-code:
    description: 'Exit code when high/critical findings exist: 0 = advisory only, 1 = fail the job'
    required: false
    default: '0'

runs:
  using: composite
  steps:
    - name: Initialize CodeQL
      uses: github/codeql-action/init@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
      with:
        languages: javascript-typescript
        queries: security-extended

    - name: Run CodeQL analysis
      uses: github/codeql-action/analyze@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
      with:
        category: /language:javascript-typescript
        output: ${{ runner.temp }}/codeql-results
        upload: false

    - name: Annotate findings and write job summary
      shell: bash
      run: |
        echo "CodeQL results directory:"
        ls -la "${{ runner.temp }}/codeql-results/" 2>&1 || echo "(directory not found)"

        SARIF_FILE=$(find "${{ runner.temp }}/codeql-results" -name "*.sarif" 2>/dev/null | head -1)
        echo "SARIF file: ${SARIF_FILE:-<none>}"

        {
          echo "## CodeQL Security Scan"
          echo ""
          echo "Query suite: \`security-extended\` (JavaScript/TypeScript)"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"

        if [ ! -f "$SARIF_FILE" ]; then
          echo "No SARIF output found." >> "$GITHUB_STEP_SUMMARY"
          echo "No SARIF output found — skipping annotation."
          exit 0
        fi

        echo "Parsing SARIF..."
        echo "  jq version: $(jq --version)"
        echo "  result count: $(jq '.runs[0].results | length' "$SARIF_FILE")"
        echo "  rule count:   $(jq '(.runs[0].tool.driver.rules // []) | length' "$SARIF_FILE")"
        echo "  sample result level: $(jq -r '.runs[0].results[0].level // "(null)"' "$SARIF_FILE")"
        echo "  sample rule level:   $(jq -r '(.runs[0].tool.driver.rules // [])[0].defaultConfiguration.level // "(null)"' "$SARIF_FILE")"

        # CodeQL SARIF results carry no .level on the result object — the level lives on
        # the rule definition, reachable via ruleIndex. Parse everything in one jq pass.
        COUNTS=$(jq -r '
          .runs[0] |
          (.tool.driver.rules // []) as $rules |
          [.results[] |
            (.level // $rules[.ruleIndex].defaultConfiguration.level // "note")] |
          {
            error:   (map(select(. == "error"))   | length),
            warning: (map(select(. == "warning")) | length),
            note:    (map(select(. == "note"))    | length)
          } |
          "\(.error) \(.warning) \(.note)"
        ' "$SARIF_FILE" 2>&1) || COUNTS="0 0 0"
        COUNTS=${COUNTS:-"0 0 0"}
        echo "Counts string: '$COUNTS'"

        read -r ERROR_COUNT WARNING_COUNT NOTE_COUNT <<< "$COUNTS"
        echo "E=$ERROR_COUNT W=$WARNING_COUNT N=$NOTE_COUNT"

        # Emit workflow annotations
        jq -r '
          .runs[0] |
          (.tool.driver.rules // []) as $rules |
          .results[] |
          (.level // $rules[.ruleIndex].defaultConfiguration.level // "note") as $level |
          (.locations[0].physicalLocation.artifactLocation.uri // "unknown") as $file |
          (.locations[0].physicalLocation.region.startLine // 1) as $line |
          (.ruleId // "unknown") as $rule |
          (.message.text // "") as $msg |
          if $level == "error" then
            "::error file=\($file),line=\($line),title=CodeQL: \($rule)::\($msg)"
          elif $level == "warning" then
            "::warning file=\($file),line=\($line),title=CodeQL: \($rule)::\($msg)"
          else
            "::notice file=\($file),line=\($line),title=CodeQL: \($rule)::\($msg)"
          end' "$SARIF_FILE" 2>/dev/null || true

        {
          echo "| Severity | Count |"
          echo "|----------|-------|"
          echo "| High / Critical | $ERROR_COUNT |"
          echo "| Medium | $WARNING_COUNT |"
          echo "| Low / Info | $NOTE_COUNT |"
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "${{ inputs.exit-code }}" = "1" ] && [ "$ERROR_COUNT" -gt 0 ]; then
          echo "CodeQL found $ERROR_COUNT high/critical finding(s). Failing job."
          exit 1
        fi
