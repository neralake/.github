name: Trivy Security Scan
description: Scans the repository for secrets and vulnerabilities using Trivy.

inputs:
  scan-ref:
    description: 'Path to scan for secrets'
    required: false
    default: '.'
  vuln-scan-ref:
    description: 'Path to scan for vulnerabilities (defaults to scan-ref)'
    required: false
    default: ''
  severity:
    description: 'Comma-separated severities to report (UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)'
    required: false
    default: 'CRITICAL,HIGH'
  exit-code:
    description: 'Exit code when findings exist: 0 = advisory only, 1 = fail the job'
    required: false
    default: '0'
  ignore-unfixed:
    description: 'Ignore vulnerabilities with no available fix'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Cache Trivy vulnerability database
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/.trivy-cache
        key: trivy-db-${{ runner.os }}-${{ github.run_id }}
        restore-keys: trivy-db-${{ runner.os }}-

    - name: Scan source code for secrets
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: ${{ inputs.scan-ref }}
        scanners: 'secret'
        cache-dir: ${{ github.workspace }}/.trivy-cache
        format: 'json'
        output: ${{ runner.temp }}/trivy-secrets.json

    - name: Scan for vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: ${{ inputs.vuln-scan-ref || inputs.scan-ref }}
        scanners: 'vuln'
        severity: ${{ inputs.severity }}
        exit-code: '0'
        ignore-unfixed: ${{ inputs.ignore-unfixed }}
        trivyignores: ${{ github.action_path }}/.trivyignore.yaml
        cache-dir: ${{ github.workspace }}/.trivy-cache
        format: 'json'
        output: ${{ runner.temp }}/trivy-vulns.json

    - name: Report findings and write job summary
      shell: bash
      run: |
        SECRETS_JSON="${{ runner.temp }}/trivy-secrets.json"
        VULNS_JSON="${{ runner.temp }}/trivy-vulns.json"

        SECRET_COUNT=$(jq '[.Results[]?.Secrets // [] | .[]] | length' "$SECRETS_JSON" 2>/dev/null || echo 0)
        SECRET_COUNT=${SECRET_COUNT:-0}

        CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' "$VULNS_JSON" 2>/dev/null || echo 0)
        HIGH=$(jq     '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")]     | length' "$VULNS_JSON" 2>/dev/null || echo 0)
        MEDIUM=$(jq   '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")]   | length' "$VULNS_JSON" 2>/dev/null || echo 0)
        LOW=$(jq      '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")]      | length' "$VULNS_JSON" 2>/dev/null || echo 0)
        CRITICAL=${CRITICAL:-0}; HIGH=${HIGH:-0}; MEDIUM=${MEDIUM:-0}; LOW=${LOW:-0}
        VULN_COUNT=$((CRITICAL + HIGH + MEDIUM + LOW))

        # Log output
        echo "=== Secrets: $SECRET_COUNT found ==="
        if [ "$SECRET_COUNT" -gt 0 ]; then
          jq -r '.Results[]? | select(.Secrets) | .Target as $t | .Secrets[] |
            "  [\(.Severity)] \($t):\(.StartLine) — \(.Title)"' "$SECRETS_JSON"
          jq -r '.Results[]? | select(.Secrets) | .Target as $t | .Secrets[] |
            "::warning file=\($t),line=\(.StartLine),title=Secret detected [\(.RuleID)]::\(.Title)"' "$SECRETS_JSON"
        fi

        echo "=== Vulnerabilities: CRITICAL=$CRITICAL HIGH=$HIGH MEDIUM=$MEDIUM LOW=$LOW ==="
        if [ "$VULN_COUNT" -gt 0 ]; then
          jq -r '.Results[]? | select(.Vulnerabilities) | .Vulnerabilities[] |
            "  [\(.Severity)] \(.PkgName) \(.InstalledVersion) → \(.FixedVersion // "no fix") (\(.VulnerabilityID))"' "$VULNS_JSON"
        fi

        # Job summary
        {
          echo "## Trivy Security Scan"
          echo ""

          echo "### Secrets"
          echo ""
          if [ "$SECRET_COUNT" -eq 0 ]; then
            echo "No secrets detected."
          else
            echo "| File | Line | Severity | Finding |"
            echo "|------|------|----------|---------|"
            jq -r '.Results[]? | select(.Secrets) | .Target as $t | .Secrets[] |
              "| \($t) | \(.StartLine) | \(.Severity) | \(.Title) |"' "$SECRETS_JSON"
          fi

          echo ""
          echo "### Vulnerabilities"
          echo ""
          echo "Severities reported: \`${{ inputs.severity }}\`"
          echo ""
          echo "| Severity | Count |"
          echo "|----------|-------|"
          echo "| Critical | $CRITICAL |"
          echo "| High     | $HIGH |"
          echo "| Medium   | $MEDIUM |"
          echo "| Low      | $LOW |"
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "${{ inputs.exit-code }}" = "1" ] && [ "$VULN_COUNT" -gt 0 ]; then
          echo "Trivy found $VULN_COUNT vulnerability/vulnerabilities. Failing job."
          exit 1
        fi
